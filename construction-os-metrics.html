<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Construction OS — Before & After</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f6f8;
    color: #1a2332;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  .container {
    width: 100%;
    max-width: 900px;
  }
  header {
    text-align: center;
    margin-bottom: 40px;
  }
  h1 {
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 8px;
    color: #0d1b2a;
  }
  .subtitle {
    color: #5a6b80;
    font-size: 1rem;
  }
  table {
    width: 100%;
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
    border-collapse: collapse;
  }
  thead {
    background: #0d1b2a;
    color: #fff;
  }
  th {
    padding: 18px 20px;
    text-align: left;
    font-weight: 600;
    font-size: 0.95rem;
    letter-spacing: 0.3px;
  }
  th.before { background: #8a3f3f; }
  th.after  { background: #1f6b3a; }
  td {
    padding: 20px;
    border-bottom: 1px solid #eef0f3;
    font-size: 1rem;
    vertical-align: middle;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafbfc; }
  .task {
    font-weight: 600;
    color: #0d1b2a;
  }
  .before-val {
    color: #8a3f3f;
    font-weight: 500;
  }
  .after-val {
    color: #1f6b3a;
    font-weight: 600;
  }
  .arrow {
    color: #9aa5b5;
    font-weight: 700;
    text-align: center;
    width: 40px;
  }
  footer {
    text-align: center;
    margin-top: 30px;
    color: #8995a8;
    font-size: 0.875rem;
  }
  @media (max-width: 600px) {
    th, td { padding: 12px 10px; font-size: 0.875rem; }
    h1 { font-size: 1.5rem; }
    .arrow { display: none; }
    td.arrow { display: none; }
    th.arrow-col { display: none; }
  }
</style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Construction OS</h1>
      <p class="subtitle">Before & after impact on core workflows</p>
    </header>

    <table>
      <thead>
        <tr>
          <th>Task</th>
          <th class="before">Before</th>
          <th class="arrow-col"></th>
          <th class="after">After</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="task">Contract packages</td>
          <td class="before-val">4–8 hours</td>
          <td class="arrow">→</td>
          <td class="after-val">30 minutes</td>
        </tr>
        <tr>
          <td class="task">Preliminary estimates</td>
          <td class="before-val">Half a day</td>
          <td class="arrow">→</td>
          <td class="after-val">1 hour</td>
        </tr>
        <tr>
          <td class="task">New PM onboarding</td>
          <td class="before-val">Months</td>
          <td class="arrow">→</td>
          <td class="after-val">Day one</td>
        </tr>
        <tr>
          <td class="task">Change orders</td>
          <td class="before-val">10 days</td>
          <td class="arrow">→</td>
          <td class="after-val">3 days</td>
        </tr>
      </tbody>
    </table>

    <footer>Faster cycles. Lower overhead. Same team.</footer>
  </div>
</body>
</html>
